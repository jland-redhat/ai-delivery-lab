seed_examples:
  - context: |
      For many OpenShift Container Platform customers, regulatory readiness, 
      or compliance, on some level is required before any systems can be put 
      into production. That regulatory readiness can be imposed by national 
      standards, industry standards or the organization's corporate governance 
      framework. Federal Information Processing Standards (FIPS) compliance is 
      one of the most critical components required in highly secure environments 
      to ensure that only supported cryptographic technologies are allowed on nodes.
    questions_and_answers:
      - question: |
          How do you install Openshift in FIPS mode?
        answer: |
          To enable FIPS mode for your cluster, you must run the 
          installation program from a Red Hat Enterprise Linux (RHEL) 
          computer configured to operate in FIPS mode.  You can enable 
          FIPS mode through the preferred method of install-config.yaml 
          and agentconfig.yaml. You must set value of the fips field 
          to true in the install-config.yaml file.
      - question: |
          What does FIPS do?
        answer: |
          When running Red Hat Enterprise Linux (RHEL) or Red Hat 
          Enterprise Linux CoreOS (RHCOS) booted in FIPS mode, 
          OpenShift Container Platform core components use the RHEL 
          cryptographic libraries that have been submitted to NIST 
          for FIPS 140-2/140-3 Validation on only the x86\_64, ppc64le, 
          and s390x architectures.
      - question: |
          How do you install FIPS mode on IBM Z clusters?
        answer: |
          Similar to a normal Openshift install, you must run the installation 
          program from a Red Hat Enterprise Linux (RHEL) computer configured to 
          operator in FIPS mode.  You must also enable FIPS in either the .parm 
          file or using virt-install as outlined in the procedures for manually 
          adding IBM Z® agents.
  - context: |
      The Agent-based installation method provides the flexibility to boot your 
      on-premise servers in any way that you choose. It combines the ease of 
      use of the Assisted Installation service with the ability to run offline, 
      including in air-gapped environments. Agent-based installation is a 
      subcommand of the OpenShift Container Platform installer. It generates a 
      bootable ISO image containing all of the information required to deploy an 
      OpenShift Container Platform cluster, with an available release image.  
      The configuration is in the same format as for the installer-provisioned 
      infrastructure and userprovisioned infrastructure installation methods. 
      The Agent-based Installer can also optionally generate or accept Zero Touch 
      Provisioning (ZTP) custom resources. ZTP allows you to provision new edge 
      sites with declarative configurations of bare-metal equipment.
    questions_and_answers:
      - question: |
          What are the supported architectures for the Agent Based Installer?
        answer: |
          The supported architectures for the Agent Based Installer are 64-bit x86, 64-bit ARM, ppc64le, and s390x.
      - question: |
          How does the agent installer work?
        answer: |
          The agent installer creates a bootable ISO that contains the Assisted discovery agent and the Assisted Service.
          The ISO is mounted on the bare metal hosts to bootstrap the cluster.
      - question: |
          Give me a detailed breakdown of how the installer works.
        answer: |
          One of the control plane hosts runs the Assisted Service at the start 
          of the boot process and eventually becomes the bootstrap host. This node 
          is called the rendezvous host (node 0). The Assisted Service ensures that 
          all the hosts meet the requirements and triggers an OpenShift Container 
          Platform cluster deployment. All the nodes have the Red Hat Enterprise Linux CoreOS (RHCOS) 
          image written to the disk. The non-bootstrap nodes reboot and initiate a cluster deployment. 
          Once the nodes are rebooted, the rendezvous host reboots and joins the cluster. 
          The bootstrapping is complete and the cluster is deployed.
  - context: |
      You can use a mirror registry for disconnected installations and to 
      ensure that your clusters only use container images that satisfy your 
      organization's controls on external content. Before you install a cluster 
      on infrastructure that you provision in a disconnected environment, you must 
      mirror the required container images into that environment. To mirror container 
      images, you must have a registry for mirroring.
    questions_and_answers:
      - question: How do I mirror openshift images?
        answer: |
          Using the oc-mirror binary, you download openshift images from quay.io, save it locally
          and bundle it in to a tar bundle.  Once you have your bundle, you will have to push
          it in to your local repository to point your cluster at.
      - question: |
          How do I point my cluster at my mirror registry?
        answer: |
          To use mirror images for a disconnected installation with the Agent-based Installer, 
          you must modify the install-config.yaml file.You can mirror the release image by using 
          the output of either the oc adm release mirror or oc mirror command. This is dependent 
          on which command you used to set up the mirror registry.
      - question: |
          How do you configure the Agent-based Installer to use mirrored images?
        answer: |
          You must use the output of either the oc adm release mirror command or the oc-mirror 
          plugin to configure the Agent-based Installer to use mirrored images.
