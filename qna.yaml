      ## OBJECT OF THE GAME

      - 1 rulebook
      - 2 haunt books ( Traitor's Tome and Secrets of Survival )

      44 room tiles

      - 1 Entrance Hall/Foyer/Grand Staircase tile
      - 6 plastic explorer figures
      - 6 two-sided character cards
      - 30 plastic clips
      - 8 dice
      - 1 Turn/Damage track
      - 13 omen cards
      - 22 item cards
      - 45 event cards
      - 149 tokens, including:

      12 large circular monster tokens 91 small circular monster tokens

      (red, orange, yellow, green, blue, purple, magenta)

      14 square event and room tokens

      14 pentagonal item tokens

      18 triangular Trait Roll tokens

      Explore the house and make your explorer stronger until the haunt begins. After that, your goal is to complete your side's victory condition first, either as a traitor or a hero.
