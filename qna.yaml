  - question: After starting the haunt which player goes first?
    answer: |
      The player to the haunt revealer's left.
  - question: What happens if a player is knocked unconscious?
    answer: |
      The player can't be knocked unconscious until after the haunt is revealed. But if one of their stats drops to a skull then they are out of the game until the haunt is over.
  - question: How many dice do I roll for a haunt?
    answer: |
      When an Omen Card is draw the player rolls 6 dice
